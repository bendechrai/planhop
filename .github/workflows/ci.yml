name: CI

# Manual trigger only: the gates run locally in .githooks/pre-push
# (bin/preflight.sh) so no hosted minutes are spent per push. Run this by hand
# before a release when a change could behave differently on macOS, which the
# local gates cannot cover.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # docs/choose.js is generated from src/choose.ts; the page must not drift from the tool
      - run: git diff --exit-code docs/choose.js
