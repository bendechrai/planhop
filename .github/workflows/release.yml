name: Release

# Push a tag like v0.3.0 (matching package.json's version) to stage a release on npm.
# Uses npm Trusted Publishing (no token; provenance is added automatically) in
# stage-only mode: the version goes live only after a maintainer approves it
# with 2FA, on npmjs.com (Staged Packages tab) or with `npm stage approve <id>`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Staged publishing needs npm 11.15.0 or later
      - run: npm install -g npm@latest
      - run: npm stage publish
